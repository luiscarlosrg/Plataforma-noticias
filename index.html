<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NovaNews</title>

    <link rel="stylesheet" href="css/output.css">
    <link rel="icon" type="image/x-icon" href="/image/noticias.png">

</head>


<body class="bg-gray-100 text-gray-800">


    <!-- HEADER -->

    <header-component></header-component>

    <!-- HERO -->

    <section
        class="bg-blue-600 text-white"
    >

        <div
            class="max-w-6xl mx-auto px-6 py-10 text-center"
        >

            <h1
                class="text-3xl md:text-4xl font-bold mb-4"
            >
                Bienvenido a
                <span class="text-yellow-300">
                    NovaNews
                </span>
            </h1>


            <p
                class="max-w-xl mx-auto text-sm leading-relaxed text-blue-100 mb-6"
            >
                Descubre las noticias más recientes sobre
                tecnología, ciencia, turismo e innovación.
            </p>


            <a
                href="#noticias"
                class="
                    inline-block
                    bg-yellow-400
                    text-gray-900
                    text-xs
                    font-semibold
                    px-5
                    py-2.5
                    rounded
                    hover:bg-yellow-300
                    transition
                "
            >
                Ver Noticias
            </a>

        </div>

    </section>


    <!-- NOTICIAS -->

    <main
        id="noticias"
        class="max-w-6xl mx-auto px-6 py-8"
    >

        <section>

            <div class="mb-5">

                <h2
                    class="text-lg font-bold text-gray-800"
                >
                    Noticias Destacadas
                </h2>

                <div
                    class="w-10 h-0.5 bg-blue-600 mt-2"
                ></div>

            </div>


            <!-- CARDS -->

            <div
                id="contenedor-noticias"
                class="
                    grid
                    grid-cols-1
                    sm:grid-cols-2
                    lg:grid-cols-3
                    gap-4
                "
            >

                <!-- JavaScript cargará las noticias -->

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer-component></footer-component>
    
    <script src="components/general.js"></script> 
    <script src="js/app.js"></script>

</body>

</html>
