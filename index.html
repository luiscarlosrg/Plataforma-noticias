<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plataforma de Noticias</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="bg-gray-100">

    <header class="bg-blue-700 text-white shadow-md">

                📰 Plataforma de Noticias
            </h1>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">

        <section class="bg-white rounded-2xl shadow-md p-10 text-center">

        </section>
        <section class="mt-12">

    <h2 class="text-3xl font-bold text-gray-800 mb-8">

    <div id="contenedor-noticias" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Las noticias aparecerán aquí mediante JavaScript -->

</section>

    </main>

    <script type="module" src="js/app.js"></script>
