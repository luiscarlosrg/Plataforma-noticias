<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detalle - NovaNews</title>

    <link rel="stylesheet" href="css/output.css">

</head>


<body class="bg-gray-100 text-gray-800">


    <!-- HEADER -->

    <header class="bg-blue-600 text-white shadow-sm">

        <nav
            class="
                max-w-6xl
                mx-auto
                px-5
                py-3
                flex
                items-center
                justify-between
            "
        >

            <a
                href="index.html"
                class="font-bold text-lg"
            >
                📰 NovaNews
            </a>


            <div class="flex gap-2 text-xs">

                <a
                    href="index.html"
                    class="
                        px-3
                        py-2
                        rounded
                        hover:bg-blue-700
                    "
                >
                    Inicio
                </a>


                <a
                    href="favoritos.html"
                    class="
                        px-3
                        py-2
                        rounded
                        hover:bg-blue-700
                    "
                >
                    Favoritos
                </a>

            </div>

        </nav>

    </header>


    <!-- CONTENIDO -->

    <main
        class="
            max-w-4xl
            mx-auto
            px-6
            py-8
        "
    >

        <a
            href="index.html"
            class="
                inline-block
                text-xs
                text-blue-600
                hover:text-blue-800
                mb-5
            "
        >
            ← Volver a noticias
        </a>


        <article
            id="detalle-noticia"
            class="
                bg-white
                border
                border-gray-200
                rounded-md
                shadow-sm
                overflow-hidden
            "
        >
            <!-- JavaScript cargará la noticia -->

        </article>

    </main>


    <!-- FOOTER -->

    <footer
        class="
            bg-gray-900
            text-gray-300
            mt-8
        "
    >

        <div
            class="
                max-w-6xl
                mx-auto
                px-6
                py-6
                text-center
            "
        >

            <p class="text-xs">
                © 2026 NovaNews - Plataforma de Noticias
            </p>

        </div>

    </footer>


    <script src="js/detalle.js"></script>

</body>

</html>
