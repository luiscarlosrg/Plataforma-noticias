<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestionar noticias</title>

    <link rel="stylesheet" href="css/output.css">
     <link rel="icon" type="image/x-icon" href="/image/noticias.png">
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- ==============================
         HEADER
    =============================== -->
 <header-component></header-component>


    <!-- ==============================
         CONTENIDO
    =============================== -->

    <main class="max-w-7xl mx-auto px-6 py-10">
                <a
            href="index.html"
            class="
                inline-block
                text-xs
                text-blue-600
                hover:text-blue-800
                mb-5
            "
        >
            ← Volver a Inicio
        </a>


         <div class="mb-5">

                <h2
                    class="text-lg font-bold text-gray-800"
                >
                    Noticias
                </h2>

                <div
                    class="w-10 h-0.5 bg-blue-600 mt-2"
                ></div>

            </div>


        <!-- ==============================
             FORMULARIO
        =============================== -->

        <section class="bg-white rounded-xl shadow-md p-6 mb-10">

            <h3 class="text-xl font-bold text-gray-800 mb-6">
                Crear nueva noticia
            </h3>


            <form id="formulario-noticia">

                <!-- TÍTULO -->

                <div class="mb-5">

                    <label
                        for="titulo"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Título
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Título de la noticia"
                        class="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                    >

                    <p
                        id="error-titulo"
                        class="text-red-500 text-xs mt-1"
                    ></p>

                </div>

                <!-- CATEGORÍA -->

                <div class="mb-5">

                    <label
                        for="categoria"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Categoría
                    </label>

                    <select
                        id="categoria"
                        name="categoria"
                        class="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                    >

                        <option value="">Seleccionar categoría</option>
                        <option value="tecnologia">Tecnología</option>
                        <option value="deportes">Deportes</option>
                        <option value="cultura">Cultura</option>
                        <option value="salud">Salud</option>

                    </select>

                </div>
                   
                   <p
                        id="error-categoria"
                        class="text-red-500 text-xs mt-1"
                    ></p>

                </div>
                <!-- DESCRIPCIÓN -->

                <div class="mb-5">

                    <label
                        for="descripcion"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        placeholder="Descripción de la noticia"
                        class="w-full border border-gray-300 rounded px-3 py-2 outline-none resize-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>

                    <p
                        id="error-descripcion"
                        class="text-red-500 text-xs mt-1"
                    ></p>

                </div>


                <!-- IMAGEN -->

                <div class="mb-5">

                    <label
                        for="imagen"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        URL de la imagen
                    </label>

                    <input
                        type="url"
                        id="imagen"
                        name="imagen"
                        placeholder="https://..."
                        class="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                    >

                    <p
                        id="error-imagen"
                        class="text-red-500 text-xs mt-1"
                    ></p>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700 transition"
                >
                    Crear noticia
                </button>

            </form>

        </section>


        <!-- ==============================
             LISTADO
        =============================== -->

        <section>

            <h3 class="text-xl font-bold text-gray-800 mb-6">
                Noticias existentes
            </h3>

            <div
                id="lista-noticias"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
            ></div>

        </section>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->
 <footer-component></footer-component>
    <script src="components/general.js"></script>

    <script type="module" src="js/gestion.js"></script>

</body>

</html>
