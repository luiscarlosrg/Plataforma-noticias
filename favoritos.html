<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"

    <title>Mis Favoritos - NovaNews</title>

<body class="bg-gray-100 text-gray-800">


    <!-- HEADER -->

    <header-component></header-component>

    <!-- CONTENIDO -->

    <main
        class="max-w-6xl mx-auto px-6 py-8 min-h-[500px]"
    >

        <section>

            <div class="mb-5">

                <h1
                    class="text-lg font-bold text-gray-800"
                >

                <div

                ></div>

                    class="text-xs text-gray-500 mt-2"
                >
                    Noticias que has guardado.
                </p>

            </div>


            <!-- CARDS -->

            <div
                id="contenedor-favoritos"
                class="
                    grid
                    grid-cols-1
                    sm:grid-cols-2
                    lg:grid-cols-3
                    gap-4

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer-component></footer-component>

    <script src="components/general.js"></script>
